<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Individual Transcriptions — Dutch Restoration (1816–1820)</title>
    <style>
        :root { color-scheme: dark; --bg: #1a1a1a; --panel: #222222; --panel-alt: #2d2d2d; --fg: #e0e0e0; --muted: #9a9a9a; --line: #333333; --accent: #4a9eff; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.55; margin: 0; padding: 16px 22px; }
        select option { background-color: var(--panel); color: var(--fg); }
        .topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--panel-alt); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
        .nav-links, .nav-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        a.nav-btn, button.nav-btn, select.nav-btn { background: var(--panel); color: var(--fg); border: 1px solid #444; padding: 7px 12px; border-radius: 5px; font-size: 13px; text-decoration: none; cursor: pointer; }
        a.nav-btn:hover, button.nav-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        button.nav-btn[aria-disabled="true"], button.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #doc-title { margin: 0 10px; font-size: 16px; color: #fff; }
        .viewer-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
        @media (max-width: 960px) { .viewer-grid { grid-template-columns: 1fr; } }
        .scan-pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; position: relative; height: calc(100vh - 130px); min-height: 460px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .scan-tools { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 5; background: rgba(20, 20, 20, 0.82); color: #ccc; padding: 6px 12px; border-radius: 5px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .scan-tools button { pointer-events: auto; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
        #scan-img { max-width: 96%; max-height: 96%; transform-origin: 0 0; cursor: zoom-in; user-select: none; -webkit-user-drag: none; }
        .transcript-pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px; max-height: calc(100vh - 130px); overflow-y: auto; }
        .pane-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
        #transcript-output h1, #transcript-output h2, #transcript-output h3, #transcript-output h4 { color: #ffffff; }
        #transcript-output a { color: var(--accent); }
        #transcript-output table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
        #transcript-output th { background: #2a2a2a; color: #fff; text-align: left; padding: 8px 10px; border: 1px solid #444; }
        #transcript-output td { padding: 8px 10px; border: 1px solid #444; vertical-align: top; }
        #transcript-output blockquote { border-left: 4px solid var(--accent); margin: 10px 0; padding: 6px 14px; background: #1e252e; }
        #transcript-output code { background: #2d2d2d; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
        #transcript-output pre { background: #181818; padding: 12px; border-radius: 5px; overflow-x: auto; border: 1px solid #333; }
        .bottom-nav { display: flex; justify-content: space-between; margin-top: 14px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="nav-links">
        <a class="nav-btn" href="index.html">← Portal</a>
        <a class="nav-btn" href="full.html">Full Documentation</a>
        <a class="nav-btn" href="dictionary.html">Keyword Dictionary</a>
    </div>
    <h1 id="doc-title">Loading…</h1>
    <div class="nav-controls">
        <select id="jump-select" class="nav-btn" aria-label="Jump to folio"></select>
        <button class="nav-btn" data-nav="prev">← Prev</button>
        <button class="nav-btn" data-nav="next">Next →</button>
    </div>
</div>

<div class="viewer-grid">
    <div class="scan-pane" id="scan-pane">
        <div class="scan-tools">
            <span id="scan-status">Loading scan…</span>
            <span>Scroll to Zoom • Drag to Pan <button id="reset-zoom-btn" type="button">Reset</button></span>
        </div>
        <img id="scan-img" alt="Archival manuscript scan">
    </div>

    <div class="transcript-pane" id="transcript-pane">
        <div class="pane-actions">
            <button id="github-report-btn" class="nav-btn" type="button">Report Issue on GitHub</button>
            <select class="nav-btn download-select" id="folio-download" aria-label="Download this transcription">
                <option value="">Download Folio…</option>
                <option value="md">Markdown (.md)</option>
                <option value="html">Web Page (.html)</option>
                <option value="doc">Word (.doc)</option>
            </select>
        </div>
        <div id="transcript-output">Loading transcription…</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-btn" data-nav="prev">← Previous Folio</button>
    <button class="nav-btn" data-nav="next">Next Folio →</button>
</div>

<script src="marked.min.js"></script>
<script>
    const GITHUB_REPO = "feureau/1816Aug-1820---Period-of-Dutch-Restoration";
    marked.setOptions({ gfm: true, breaks: false, mangle: false });

    let manifest = [];
    let currentIndex = 0;
    let currentMd = "";

    const img = document.getElementById("scan-img");
    const scanPane = document.getElementById("scan-pane");
    const scanStatus = document.getElementById("scan-status");
    const out = document.getElementById("transcript-output");
    const titleEl = document.getElementById("doc-title");
    const jumpSel = document.getElementById("jump-select");

    // Pan & Zoom State
    let scale = 1, translateX = 0, translateY = 0, dragging = false, startX = 0, startY = 0;

    function applyTransform() {
        img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function resetZoom() {
        scale = 1; translateX = 0; translateY = 0;
        applyTransform();
    }

    document.getElementById("reset-zoom-btn").addEventListener("click", resetZoom);

    scanPane.addEventListener("wheel", (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.1 : 0.9;
        const rect = img.getBoundingClientRect();
        const offsetX = e.clientX - rect.left;
        const offsetY = e.clientY - rect.top;
        translateX = (translateX - offsetX) * delta + offsetX;
        translateY = (translateY - offsetY) * delta + offsetY;
        scale = Math.max(0.2, Math.min(5, scale * delta));
        applyTransform();
    }, { passive: false });

    img.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        dragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        img.style.cursor = "grabbing";
    });

    document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        applyTransform();
    });

    document.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        img.style.cursor = "zoom-in";
    });

    function addHeaderIds(root) {
        root.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach((h, i) => {
            if (!h.id) {
                const slug = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
                h.id = slug || `sec-${i}`;
            }
        });
    }

    function svgPlaceholder(label) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#1e1e1e"/><text x="50%" y="48%" fill="#888" font-family="sans-serif" font-size="18" text-anchor="middle">Scan unavailable</text><text x="50%" y="56%" fill="#666" font-family="monospace" font-size="14" text-anchor="middle">${label}</text></svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function loadImageWithFallback(entry) {
        const stem = entry.id;
        const candidates = [entry.image, `jpg/${stem}.jpg`, `jpg/${stem}.JPG`, `${stem}.jpg`];
        let idx = 0;
        scanStatus.textContent = entry.image;
        img.onerror = () => {
            idx++;
            if (idx < candidates.length) {
                img.src = candidates[idx];
            } else {
                img.onerror = null;
                img.src = svgPlaceholder(entry.image);
                scanStatus.textContent = `${entry.image} (missing)`;
            }
        };
        img.src = candidates[0];
    }

    function updateNavButtons() {
        document.querySelectorAll('[data-nav="prev"]').forEach((b) => {
            const atStart = currentIndex <= 0;
            b.disabled = atStart;
            b.setAttribute("aria-disabled", String(atStart));
        });
        document.querySelectorAll('[data-nav="next"]').forEach((b) => {
            const atEnd = currentIndex >= manifest.length - 1;
            b.disabled = atEnd;
            b.setAttribute("aria-disabled", String(atEnd));
        });
    }

    async function showFolio(index, pushState = true) {
        if (!manifest.length) return;
        currentIndex = Math.max(0, Math.min(manifest.length - 1, index));
        const entry = manifest[currentIndex];
        jumpSel.value = entry.id;
        titleEl.textContent = `${entry.id} (${currentIndex + 1} / ${manifest.length})`;
        document.title = `${entry.id} — Individual Transcriptions`;
        updateNavButtons();
        resetZoom();
        loadImageWithFallback(entry);
        out.innerHTML = "Loading transcription…";

        if (pushState) {
            const url = new URL(window.location.href);
            url.searchParams.set("id", entry.id);
            history.replaceState(null, "", url.toString());
        }

        try {
            const resp = await fetch(entry.text, { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            currentMd = await resp.text();
            out.innerHTML = marked.parse(currentMd);
            addHeaderIds(out);
            document.getElementById("transcript-pane").scrollTop = 0;
        } catch (err) {
            currentMd = "";
            out.innerHTML = `<p style="color:#ff7b7b;">Failed to load ${entry.text}: ${err.message}. If viewing locally via <code>file://</code>, run <code>launch_server.bat</code>.</p>`;
        }
    }

    document.querySelectorAll('[data-nav="prev"]').forEach((b) => b.addEventListener("click", () => showFolio(currentIndex - 1)));
    document.querySelectorAll('[data-nav="next"]').forEach((b) => b.addEventListener("click", () => showFolio(currentIndex + 1)));
    jumpSel.addEventListener("change", () => {
        const idx = manifest.findIndex((x) => x.id === jumpSel.value);
        if (idx >= 0) showFolio(idx);
    });

    document.addEventListener("keydown", (e) => {
        if (e.target && e.target.matches("input,textarea,select")) return;
        if (e.key === "ArrowLeft") showFolio(currentIndex - 1);
        else if (e.key === "ArrowRight") showFolio(currentIndex + 1);
    });

    document.getElementById("github-report-btn").addEventListener("click", () => {
        const entry = manifest[currentIndex];
        if (!entry) return;
        const sel = window.getSelection();
        let selectedText = "";
        if (sel && sel.rangeCount > 0 && out.contains(sel.anchorNode)) {
            selectedText = sel.toString().trim();
        }
        const quote = selectedText ? selectedText.split("\n").map((l) => `> ${l}`).join("\n") : "> *(Highlight offending text before clicking, or paste excerpt here)*";
        const body = `**Transcription ID:** ${entry.id}\n\n**Original Text:**\n${quote}\n\n**Suggested Correction / Notes:**\n`;
        const url = `https://github.com/${GITHUB_REPO}/issues/new?title=${encodeURIComponent(`Errata: ${entry.id}`)}&body=${encodeURIComponent(body)}`;
        window.open(url, "_blank", "noopener");
    });

    document.getElementById("folio-download").addEventListener("change", (e) => {
        const fmt = e.target.value;
        e.target.value = "";
        const entry = manifest[currentIndex];
        if (!fmt || !entry || !currentMd) return;

        let blob, filename;
        if (fmt === "md") {
            blob = new Blob([currentMd], { type: "text/markdown;charset=utf-8" });
            filename = `${entry.id}.md`;
        } else if (fmt === "html") {
            const htmlDoc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${entry.id}</title><style>body{font-family:Georgia,serif;max-width:900px;margin:24px auto;line-height:1.55;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #888;padding:6px 8px;vertical-align:top;}</style></head><body>${marked.parse(currentMd)}</body></html>`;
            blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
            filename = `${entry.id}.html`;
        } else if (fmt === "doc") {
            const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${entry.id}</title></head><body>${marked.parse(currentMd)}</body></html>`;
            blob = new Blob(["\ufeff", wordHtml], { type: "application/msword" });
            filename = `${entry.id}.doc`;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    async function init() {
        try {
            const resp = await fetch("data.json", { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            manifest = await resp.json();
            jumpSel.innerHTML = manifest.map((item, idx) => `<option value="${item.id}">[${idx + 1}/${manifest.length}] ${item.id}</option>`).join("");
            const reqId = new URLSearchParams(window.location.search).get("id");
            const startIdx = reqId ? Math.max(0, manifest.findIndex((x) => x.id === reqId)) : 0;
            showFolio(startIdx, false);
        } catch (err) {
            titleEl.textContent = "Manifest Error";
            out.innerHTML = `<p style="color:#ff7b7b;">Unable to load <code>data.json</code>: ${err.message}. Run <code>launch_server.bat</code> to serve locally.</p>`;
        }
    }
    init();
</script>
</body>
</html>
