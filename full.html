<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Full Documentation — Dutch Restoration (1816–1820)</title>
    <style>
        :root { color-scheme: dark; --bg: #1a1a1a; --panel: #222222; --panel-alt: #2d2d2d; --fg: #e0e0e0; --muted: #9a9a9a; --line: #333333; --accent: #4a9eff; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6; max-width: 1100px; margin: 0 auto; padding: 20px; }
        select option { background-color: var(--panel); color: var(--fg); }
        .header-section { background: var(--panel-alt); border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px; margin-bottom: 16px; }
        .nav-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 8px; }
        a.btn, select.btn, button.btn { background: var(--panel); color: var(--fg); border: 1px solid #444; padding: 7px 12px; border-radius: 5px; font-size: 13px; text-decoration: none; cursor: pointer; transition: all 0.15s ease; }
        a.btn:hover, button.btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .status-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
        #collection-export-bar { margin-bottom: 18px; }
        .transcription-section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 24px; margin-bottom: 22px; }
        .section-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
        .section-bar strong { color: #fff; font-size: 15px; }
        .section-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .transcription-body { overflow-x: auto; }
        .transcription-body h1, .transcription-body h2, .transcription-body h3, .transcription-body h4 { color: #fff; line-height: 1.25; }
        .transcription-body h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
        .transcription-body a { color: var(--accent); }
        .transcription-body code { background: #2d2d2d; color: #e6e6e6; padding: 2px 5px; border-radius: 3px; font-size: 0.92em; }
        .transcription-body pre { background: #181818; padding: 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; overflow-x: auto; }
        .transcription-body pre code { background: transparent; padding: 0; }
        .transcription-body hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
        .transcription-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
        .transcription-body th { background: #2a2a2a; color: #fff; text-align: left; padding: 8px 10px; border: 1px solid #444; }
        .transcription-body td { padding: 8px 10px; border: 1px solid #444; vertical-align: top; }
        .transcription-body tr:nth-child(even) { background: #1f1f1f; }
        .transcription-body blockquote { border-left: 4px solid var(--accent); margin: 10px 0; padding: 6px 14px; background: #1e252e; color: #c8d2dc; }
        #backToTop { position: fixed; right: 24px; bottom: 24px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 20px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s; box-shadow: 0 3px 10px rgba(0,0,0,0.45); }
        #backToTop.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="header-section">
    <div class="nav-row">
        <div class="nav-links">
            <a class="btn" href="index.html">← Portal</a>
            <a class="btn" href="transcriptions.html">Side-by-Side Viewer</a>
            <a class="btn" href="dictionary.html">Keyword Dictionary</a>
        </div>
        <select id="jump-select" class="btn" aria-label="Jump to folio"></select>
    </div>
    <h1 style="margin:0 0 8px 0;font-size:22px;color:#fff;">Full Documentation (336 Archival Folios)</h1>
    <div class="status-row">
        <span id="status-text">Initializing…</span>
        <span id="progress-indicator">0%</span>
    </div>
</div>

<div id="collection-export-bar"></div>
<div id="markdown-output"></div>

<button id="backToTop" type="button" title="Back to top">↑</button>

<script src="marked.min.js"></script>
<script src="js/vendor/fflate.min.js"></script>
<script src="js/vendor/pdf-lib.min.js"></script>
<script src="js/export.js"></script>
<script>
    const GITHUB_REPO = "feureau/1816Aug-1820---Period-of-Dutch-Restoration";
    marked.setOptions({ gfm: true, breaks: false, mangle: false });

    const mdCache = {};
    const statusText = document.getElementById("status-text");
    const progEl = document.getElementById("progress-indicator");
    const outEl = document.getElementById("markdown-output");
    const jumpSel = document.getElementById("jump-select");
    const backToTop = document.getElementById("backToTop");

    if (window.CollectionExporter) {
        window.CollectionExporter.mount(document.getElementById("collection-export-bar"), {
            manifestUrl: "data.json",
            getMdCache: () => mdCache
        });
    }

    window.addEventListener("scroll", () => {
        backToTop.classList.toggle("visible", window.scrollY > 400);
    });
    backToTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    jumpSel.addEventListener("change", () => {
        const target = document.getElementById(jumpSel.value);
        if (target) target.scrollIntoView({ behavior: "smooth" });
    });

    // Event delegation across all 336 rendered folio sections
    outEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".github-report-btn");
        if (!btn) return;
        const sec = btn.closest(".transcription-section");
        const fid = sec ? sec.id : "";
        const sel = window.getSelection();
        let selectedText = "";
        if (sel && sel.rangeCount > 0 && sec && sec.contains(sel.anchorNode)) {
            selectedText = sel.toString().trim();
        }
        const quote = selectedText ? selectedText.split("\n").map((l) => `> ${l}`).join("\n") : "> *(Highlight offending text inside this folio before clicking)*";
        const body = `**Transcription ID:** ${fid}\n\n**Original Text:**\n${quote}\n\n**Suggested Correction / Notes:**\n`;
        window.open(`https://github.com/${GITHUB_REPO}/issues/new?title=${encodeURIComponent(`Errata: ${fid}`)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
    });

    outEl.addEventListener("change", (e) => {
        const sel = e.target.closest(".download-select");
        if (!sel || !sel.value) return;
        const fmt = sel.value;
        sel.value = "";
        const sec = sel.closest(".transcription-section");
        const fid = sec ? sec.id : "";
        const md = mdCache[fid];
        if (!md) return;

        let blob, filename;
        if (fmt === "md") {
            blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
            filename = `${fid}.md`;
        } else if (fmt === "html") {
            const htmlDoc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${fid}</title><style>body{font-family:Georgia,serif;max-width:900px;margin:24px auto;line-height:1.55;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #888;padding:6px 8px;vertical-align:top;}</style></head><body>${marked.parse(md)}</body></html>`;
            blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
            filename = `${fid}.html`;
        } else if (fmt === "doc") {
            const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${fid}</title></head><body>${marked.parse(md)}</body></html>`;
            blob = new Blob(["\ufeff", wordHtml], { type: "application/msword" });
            filename = `${fid}.doc`;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    async function loadCorpus() {
        try {
            const resp = await fetch("data.json", { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const manifest = await resp.json();
            jumpSel.innerHTML = manifest.map((item, idx) => `<option value="${item.id}">[${idx + 1}/${manifest.length}] ${item.id}</option>`).join("");

            for (let i = 0; i < manifest.length; i++) {
                const entry = manifest[i];
                statusText.textContent = `Loaded ${i + 1} of ${manifest.length} folios…`;
                progEl.textContent = `${Math.round(((i + 1) / manifest.length) * 100)}%`;

                const r = await fetch(entry.text, { cache: "no-store" });
                const md = r.ok ? await r.text() : `# ${entry.id}\n\n*Failed to load ${entry.text} (HTTP ${r.status})*`;
                mdCache[entry.id] = md;

                const sec = document.createElement("section");
                sec.className = "transcription-section";
                sec.id = entry.id;
                sec.innerHTML = `
                    <div class="section-bar">
                        <strong>[${i + 1}/${manifest.length}] ${entry.id}</strong>
                        <div class="section-actions">
                            <a class="btn" href="transcriptions.html?id=${encodeURIComponent(entry.id)}">View Scan</a>
                            <button class="btn github-report-btn" type="button">Report Issue</button>
                            <select class="btn download-select" aria-label="Download ${entry.id}">
                                <option value="">Download…</option>
                                <option value="md">.md</option>
                                <option value="html">.html</option>
                                <option value="doc">.doc</option>
                            </select>
                        </div>
                    </div>
                    <div class="transcription-body">${marked.parse(md)}</div>
                `;
                outEl.appendChild(sec);
            }
            statusText.textContent = `All ${manifest.length} folios loaded successfully.`;
            progEl.textContent = "Complete";
        } catch (err) {
            statusText.textContent = `Error: ${err.message}. Run launch_server.bat for local viewing.`;
        }
    }
    loadCorpus();
</script>
</body>
</html>
